<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фронтир - Інтерактивна мапа</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="mindmap-container">
        <div id="zoom-wrapper">
            <svg id="lines-svg"></svg>

            <div id="root-node" class="node large">
                Фронтир
            </div>
        </div>
    </div>
    
    <div id="tooltip" class="tooltip"></div>

    <div id="rivers-container">
        <svg viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid meet" class="stylized-river">
            <defs>
                <!-- ... твої старі фільтри та іконки ... -->
                <filter id="waterGlow" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="12" result="blur" />
                    <feComposite in="SourceGraphic" in2="blur" operator="over" />
                </filter>
                
                <path id="tiny-house" d="M0,-3 L3,0 L3,4 L-3,4 L-3,0 Z" />
                <path id="star-fort" d="M 0,-20 L 6,-10 L 17,-10 L 12,0 L 17,10 L 6,10 L 0,20 L -6,10 L -17,10 L -12,0 L -17,-10 L -6,-10 Z" />

                <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#e94560" />
                </marker>
                <path id="fire-icon" d="M0,0 C-5,-5 -5,-10 0,-15 C2,-12 2,-8 5,-5 C7,-2 3,0 0,0 Z" fill="#ff5722" />
                
                <g id="scroll-icon">
                    <rect x="-10" y="-12" width="20" height="24" rx="2" fill="rgba(22, 33, 62, 0.9)" stroke="#f9a826" stroke-width="2"/>
                    <path d="M-5,-6 L5,-6 M-5,0 L5,0 M-5,6 L2,6" stroke="#f9a826" stroke-width="2" stroke-linecap="round"/>
                </g>
            </defs>

            <g filter="url(#waterGlow)">
                <path class="river-base" d="M 50,100 C 300,200 400,350 500,400 C 600,450 750,550 900,650 M 150,600 C 250,450 350,420 500,400" />
                <path class="river-current" d="M 50,100 C 300,200 400,350 500,400 C 600,450 750,550 900,650 M 150,600 C 250,450 350,420 500,400" />
                <path class="river-waves" d="M 100,125 C 200,165 250,185 300,220 M 350,270 C 400,320 450,350 480,370 M 550,430 C 650,480 750,530 850,610 M 200,530 C 250,460 300,440 380,420 M 600,470 C 650,500 700,540 800,600 M 150,140 C 250,190 300,220 350,260" />
            </g>

            <g id="settlement-orel" class="settlement-group timeline-hidden" data-id="orel">
                <circle cx="580" cy="320" r="60" fill="transparent" class="hitbox" />
                <text x="580" y="270" class="settlement-label">Орел</text>
                <use href="#scroll-icon" x="650" y="260" class="scroll-btn" />
            </g>

            <g id="settlement-holta" class="settlement-group timeline-hidden" data-id="holta">
                <circle cx="510" cy="460" r="55" fill="transparent" class="hitbox" />
                <text x="510" y="520" class="settlement-label">Голта</text>
                <use href="#scroll-icon" x="580" y="510" class="scroll-btn" />
            </g>

            <g id="settlement-bohopil" class="settlement-group timeline-hidden" data-id="bohopil">
                <circle cx="380" cy="360" r="55" fill="transparent" class="hitbox" />
                <text x="360" y="320" class="settlement-label">Богопіль</text>
                <use href="#scroll-icon" x="450" y="310" class="scroll-btn" />
            </g>

            <g id="event-attack" class="timeline-hidden" data-id="attack">
                <path d="M 550,330 Q 480,280 400,340" fill="none" stroke="#e94560" stroke-width="4" stroke-dasharray="10" marker-end="url(#arrowhead)" class="attack-arrow" />
                
                <g class="fires">
                    <use href="#fire-icon" x="370" y="350" class="fire-anim" />
                    <use href="#fire-icon" x="390" y="370" class="fire-anim" style="animation-delay: 0.2s" />
                    <use href="#fire-icon" x="360" y="365" class="fire-anim" style="animation-delay: 0.4s" />
                    <use href="#fire-icon" x="385" y="345" class="fire-anim" style="animation-delay: 0.1s" />
                </g>

                <use href="#scroll-icon" x="465" y="295" class="scroll-btn" />
            </g>

            <g id="settlement-fort" class="settlement-group timeline-hidden" data-id="fort">
                <circle cx="430" cy="280" r="40" fill="transparent" class="hitbox" />
                
                <use href="#star-fort" x="430" y="280" class="house-icon timeline-house" data-appear-year="1764.5" />
                
                <use href="#scroll-icon" x="470" y="260" class="scroll-btn" />
            </g>
        </svg>
    </div>

    <!-- НИЖНІЙ ІНТЕРАКТИВНИЙ ТАЙМЛАЙН-ПОВЗУНОК -->
    <div id="bottom-timeline" class="hidden">
        <div class="slider-wrapper">
            <div id="year-display">1756</div>
            
            <div class="slider-container-inner">
                <input type="range" id="year-slider" min="1756" max="1765" step="0.1" value="1756">
                <div id="slider-markers"></div>
            </div>

            <div class="slider-ticks">
                <span>1756</span>
                <span>1765</span>
            </div>
        </div>
        <button id="next-event-btn">Почати ➔</button>
    </div>
    <div id="info-modal" class="hidden">
        <div class="modal-content">
            <button id="close-modal">&times;</button>
            <h2 id="modal-title">Назва</h2>
            <p id="modal-text">Текст довідки...</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
