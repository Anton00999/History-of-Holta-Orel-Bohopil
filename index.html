<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фронтир - Інтерактивна мапа</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="mindmap-container">
        <div id="zoom-wrapper">
            <svg id="lines-svg"></svg>

            <div id="root-node" class="node large">
                Фронтир
            </div>
        </div>
    </div>
    
    <div id="tooltip" class="tooltip"></div>

    <div id="rivers-container">
        <svg viewBox="0 0 800 600" preserveAspectRatio="xMidYMid meet">
            <path class="river-path" d="M 100,150 Q 350,300 400,400 T 450,650" />
            <path class="river-path" d="M 700,50 Q 500,250 400,400" />
        </svg>
    </div>

    <script src="script.js"></script>
</body>
</html>
